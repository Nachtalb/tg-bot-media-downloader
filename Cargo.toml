[package]
name = "downloader"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Nachtalb <na@nachtalb.io>"]

[dependencies]
autocrop = "0.1.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_complete = "4.6.11"
log = "0.4.35"
pretty_env_logger = "0.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
teloxide = { version = "0.17.0", default-features = false, features = ["macros", "ctrlc_handler", "rustls"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "fs", "io-util", "process"] }
url = "2.5.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
